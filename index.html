<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Einsteigen — München U-Bahn, S-Bahn &amp; Tram Puzzle</title>
    <meta
      name="description"
      content="Test your knowledge of Munich's U-Bahn, S-Bahn, and Tram network. Pick the sequence of lines connecting two stations — Daily 5-round puzzle & Free Play."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('einsteigen-theme');
          const prefersDark =
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark =
            stored === 'dark' ||
            ((stored === 'auto' || stored === null) && prefersDark);
          if (dark) {
            const root = document.documentElement;
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#09090b');
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased selection:bg-blue-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
